# Nix for the runner (single-user: the runner owns /nix, no daemon)
experimental-features = nix-command flakes

# No privileges in the pod (no user namespaces, no mount namespace): builds without Nix's sandbox. Acceptable in an
# ephemeral pod running only trusted workflows (never pull requests).
sandbox = false

# Builds in the container's /tmp, not under /nix (Nix's default since 2.30: /nix/var/nix/builds). /nix may be a
# persistent volume whose directories Kubernetes made setgid (the pod's fsGroup), and builds copying a store directory
# there failed: "cp: setting permissions for 'source': Operation not permitted" (stdenv's unpackPhase). /tmp is the
# container's own filesystem, emptied with it: no build leftovers on the volume either. Its size is the pod's
# ephemeral storage.
build-dir = /tmp

# All of the node's cores, as many builds as it has
max-jobs = auto
cores = 0

# Flakes' own nixConfig (extra substituters...) not applied without asking
accept-flake-config = false

# cache.nixos.org here. Others (an Attic cache...) from the workflow: NIX_CONFIG with extra-substituters,
# extra-trusted-public-keys, and netrc-file for a private one's token (README.md).
substituters = https://cache.nixos.org
trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY=
